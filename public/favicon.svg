<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="botGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#25D366" />
      <stop offset="50%" stop-color="#128C7E" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background Icon Badge -->
  <rect x="5" y="5" width="90" height="90" rx="24" fill="url(#botGrad)" />
  <!-- Chat Bubble Background -->
  <path d="M 28 30 C 28 24, 72 24, 72 30 L 72 58 C 72 64, 48 64, 42 70 L 36 64 L 28 64 Z" fill="#0B141A" opacity="0.9" />
  <!-- Robot Face & Antennas -->
  <circle cx="50" cy="22" r="3.5" fill="#25D366" />
  <line x1="50" y1="25" x2="50" y2="30" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" />
  <!-- Eyes Glowing -->
  <circle cx="42" cy="42" r="4.5" fill="#25D366" filter="url(#glow)" />
  <circle cx="58" cy="42" r="4.5" fill="#25D366" filter="url(#glow)" />
  <!-- Friendly Smile Line -->
  <path d="M 42 52 Q 50 58 58 52" fill="none" stroke="#25D366" stroke-width="2.5" stroke-linecap="round" />
  <!-- Connection Dot / Sparkle -->
  <circle cx="76" cy="24" r="5" fill="#6366F1" filter="url(#glow)" />
</svg>
