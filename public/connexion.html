<!doctype html><html lang="fr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Accès à mon assistant</title><body style="font:18px system-ui;max-width:460px;margin:70px auto;padding:20px"><h1>Accéder à mon assistant</h1><p>Saisissez le code privé remis par le propriétaire de la plateforme.</p><form id="login"><label>Code d’accès <input id="token" type="password" required autocomplete="current-password" style="width:100%;padding:12px"></label><button style="margin-top:20px;padding:12px">Se connecter</button></form><p id="error" role="alert"></p><script>document.getElementById('login').onsubmit=async function(e){e.preventDefault();const token=document.getElementById('token').value.trim();try{const r=await fetch('/api/merchants/details',{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error();const d=await r.json();sessionStorage.setItem('bot-access',token);const next=new URLSearchParams(location.search).get('next');location.href=next&&next.startsWith('/')&&!next.startsWith('//')?next:'/dashboard?shop='+encodeURIComponent(d.merchant.slug||d.merchant.id);}catch{document.getElementById('error').textContent='Code incorrect ou service indisponible.';}};</script></body></html>
